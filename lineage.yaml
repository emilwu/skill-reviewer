known_limitations:
  - "C1-C7 eval cases under evals/ are run via tools/run_evals.py (staged plugin copy); the costed per-case runs are an owner/GM budget decision, not part of the build."
  - "The fact reporter's reference-graph scan treats any directory mentioned in a link/backtick path as fully referenced (all files under it); a Skill that names a directory in prose without linking every file inside it will not show those files as unreferenced."
  - "revise_support.py's verify command compares bare root-relative paths across a proposal's target roots; two different --root arguments sharing an identical relative path would collide in the changed-path set — acceptable for this reviewer's single-target-root usage, not yet handled for a genuinely multi-root proposal."
